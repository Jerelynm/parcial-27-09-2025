<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial II</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 style="text-align:center;">B I E N V E N I D O</h1>
        <h2 style="text-align:center;">F A C E B O O K</h2>
    </header>
    <main>
        <div id="sessionMessage"></div>
        <center><h3 id="formTitle">Formulario de Inicio de Sesión</h3></center>
        <form id="loginForm">
            <label for="loginIdentifier">Correo Electrónico o Teléfono:</label>
            <input type="text" id="loginIdentifier" name="loginIdentifier" required>
            
            <label for="loginPassword">Contraseña:</label>
            <input type="password" id="loginPassword" name="loginPassword" required>
            
            <button type="submit">Iniciar Sesión</button>
        </form>
        <center><h4>¿No tienes cuenta?</h4></center>
        <button id="showRegisterBtn">Crear Cuenta</button>
        <form id="registerForm" style="display:none; margin-top:20px;">
            <label for="firstName">Nombre:</label>
            <input type="text" id="firstName" name="firstName" required>
            
            <label for="lastName">Apellido:</label>
            <input type="text" id="lastName" name="lastName" required>
            
            <label for="newEmail">Correo Electrónico:</label>
            <input type="email" id="newEmail" name="newEmail" required>
            
            <label for="phone">Teléfono:</label>
            <input type="tel" id="phone" name="phone" required>
            
            <label for="newPassword">Contraseña:</label>
            <input type="password" id="newPassword" name="newPassword" required>
            
            <label for="confirmPassword">Confirmar Contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            
            <button type="submit">Registrar</button>
        </form>
        <div id="message"></div>
    </main>
    <footer>
        <center><p>&copy; 2025 Facebook. Todos los derechos reservados.</p></center>
    </footer>
</body>
</html>
