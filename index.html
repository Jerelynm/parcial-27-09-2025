<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial II</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 style="text-align:center;">B I E N V E N I D O</h1>
        <h2 style="text-align:center;">F A C E B O O K</h2>
    </header>
    <main>
        <h3 id="formTitle">Formulario de Inicio de Sesión</h3>
        <form id="loginForm">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Iniciar Sesión</button>
        </form>
        <button id="showRegisterBtn">Crear Cuenta</button>
        <form id="registerForm" style="display:none; margin-top:20px;">
            <label for="newEmail">Correo Electrónico:</label>
            <input type="email" id="newEmail" name="newEmail" required>
            
            <label for="newPassword">Contraseña:</label>
            <input type="password" id="newPassword" name="newPassword" required>
            
            <button type="submit">Registrar</button>
        </form>
        <div id="message"></div>
    </main>
    <footer>
        <p>&copy; 2025 Facebook. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
